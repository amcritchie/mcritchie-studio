# Release repo registry — the producer/consumer classification for the Deploy
# workflow (Workflow 2). Single source of truth read by `Release::Repos`.
#
# The Deploy workflow ships a release PRODUCER-FIRST: a gem (a *producer*) is
# published to RubyGems BEFORE the apps (its *consumers*) that depend on it
# deploy, so a consuming app always builds against the just-published version.
# `bin/release prepare` (Avi's qa-release sweep) publishes every gem member
# at QA assembly — after a fail-closed preflight over ALL swept gems, BEFORE
# the pre-QA gate and any QA deploy — and commits each consumer's lock bump
# onto origin/release. `bin/release ship` ("Run Deployment") re-verifies each
# gem idempotently (already-live → skip) before the app deploys.
#
# Read by:
#   * Release::Repos (app/models/release/repos.rb) — kind/gem?/app?/gem_meta
#   * Release::Conductor.member_plan — tags each release member gem vs app
#   * bin/release — skips the branch-merge for gem members; publishes them first
#   * Task#release_repo / #gem_release? — board 💎 gem badge + ordering
#
# Two member kinds:
#   gems — published to RubyGems. They have NO app branch in mcritchie-studio;
#          their PR/branch lives in the gem's own repo. They ride the release as
#          a record, are published at prepare (BEFORE the pre-QA gate + QA
#          deploy; ship re-verifies idempotently), and are QA'd via a consuming
#          app's bumped Gemfile.lock.
#   apps — deployed. A HASH keyed by repo slug; each app carries a `prod_deploy`
#          adapter describing HOW it ships to production (the multi-repo conductor
#          reads this so one release can drive heterogeneous deploys). They have a
#          branch merged onto the release branch.
#
# prod_deploy is OPTIONAL. An app that has no production deployment target
# omits it entirely, and ship advances its main and records `no production
# deploy target — nothing dispatched`. NEVER paper over a missing target with a
# no-op deploy script: that makes ship report a deploy that did not happen.
# A declared adapter is a PROMISE that its `command` exists on disk — repos_test
# asserts exactly that, so a command that never existed fails at test time
# instead of at G4 with main already advanced.
#
# prod_deploy adapters (the `strategy` selects the deploy mechanic):
#   git_push_heroku — push the release/main branch to a Heroku git remote.
#       remote    — the git remote name or Heroku git URL to push to (e.g. heroku).
#       branch    — the branch the remote deploys (e.g. main).
#       smoke_url — the production URL to smoke-test after the push.
#   github_actions — dispatch a GitHub Actions workflow and WATCH it to completion
#                 (DevOps v2 Phase 2 — the HUB). The workflow does the Heroku push
#                 AND the hard /up smoke server-side. The `production` Environment's
#                 required-reviewer approval was removed 2026-07-20, so the dispatched
#                 run deploys straight through — the ship-confirm is launching
#                 bin/release ship. The conductor runs NO curl-smoke of its own for
#                 this adapter — the workflow owns it.
#       workflow  — the .github/workflows filename to dispatch (e.g. prod-deploy.yml).
#       smoke_url — the production URL, KEPT for the board/deploy record even though
#                 the workflow (not the conductor) runs the smoke.
#     The QA-deploy twin is a fixed `qa-deploy.yml`, dispatched by `bin/release
#     prepare` for this adapter instead of `bin/qa-server deploy`.
#   repo_script — shell out to a deploy script that lives IN the app repo (the
#                 repo owns its own deploy logic; the conductor just invokes it).
#       command — the repo-relative deploy script (e.g. bin/deploy).
#       args    — argv passed to the script (e.g. ["--yes"] to skip prompts).
#     CONTRACT (read before registering a new one). The script runs with cwd = the
#     repo's SHIP WORKSPACE (<repo>/.worktrees/_ship): a private worktree with a
#     DETACHED HEAD at the QA-frozen SHA, a clean tree, and the repo's shared git
#     config/remotes. So:
#       * `git rev-parse --abbrev-ref HEAD` is the literal "HEAD", not "main" — a
#         script that pushes must use a refspec that works detached (turf's
#         `PUSH_SPEC="$BRANCH:main"` becomes `HEAD:main`, which pushes the frozen
#         commit — exactly right).
#       * GITIGNORED artifacts are NOT there on a fresh workspace (no node_modules,
#         no app/assets/builds, no .env beyond the one the conductor mirrors in).
#         Verify the script's own test/build steps survive that.
#       * The ONLY env the conductor adds is DATABASE_URL, pointing at the
#         workspace's private test DB (<app>_ship_test) so the script's pre-prod
#         suite can't collide with a concurrent one. It is NOT test-scoped (a Rails
#         builtin): a deploy script must not run a development-env rails command and
#         expect its dev database. RAILS_ENV is deliberately NOT set — precompiling
#         assets under RAILS_ENV=test would build the wrong artifact and ship it.
#
# Optional per-app `qa_deploy: { app: <qa-server-key> }` overrides the qa-server
# target; absent, `Release::Repos.qa_app` defaults the key to the repo slug.
#
# Optional per-app `test_cmd` is the conductor's pre-prod gate (G4 Ship):
# `bin/release ship` runs it (cwd = the repo's ISOLATED GATE WORKSPACE, at its
# QA-frozen SHA) right before the irreversible prod deploy and scoped-aborts on
# red. DOUBLE-TEST CAVEAT: only set it where the repo's own deploy does NOT
# already run the suite. The hub deploys via github_actions (a workflow that runs
# NO test step, just the Heroku push + smoke), so it carries
# `test_cmd: bin/rails db:test:prepare test test:system` (any command SHAPE
# works here — argless or path-arg — because `prepare_gate_workspace!` runs
# `bin/rails db:test:prepare test:prepare` in the gate workspace first, building the
# gitignored app/assets/builds/tailwind.css whatever the registered line looks like;
# gate-workspace-skips-test-prepare, PR #522. See
# docs/agents/modules/testing.md). The `repo_script` satellites SELF-GATE —
# their bin/deploy runs their own tests — so they leave `test_cmd` UNSET to avoid
# running the whole suite twice per ship. G4 ALSO self-gates against G3, but ONLY
# against the verdict G3 RECORDED (metadata["qa_gates"][repo] = {sha, cmd, ok},
# written only on a green pre-QA suite): same command + same frozen SHA + green
# => the ship gate records a skip SOP instead of re-running. No record, a red
# record, a different command, or a drifted SHA all FAIL OPEN and run the gate
# (bin/release test_gate / Release::ShipSequence.ship_gate_skip?).
#
# DO NOT blank `qa_test_cmd` to bypass a red G3. That was a documented recipe and
# it is now a closed foot-gun: it used to make G4 skip a suite NOTHING had run
# (the old skip rule compared registry strings against the DEPLOYED sha), which
# silently disarmed the last gate before production.
#
# Optional per-app `qa_test_cmd` is Avi's PRE-QA gate (G3 Candidate):
# `bin/release prepare` runs it BEFORE any QA deploy — the tier prepare owns
# (Release::STEP_TEST_TIERS). A red gate aborts prepare with eject guidance while
# every swept member is still `reviewed` (nothing flipped, nothing deployed).
# UNSET = the repo self-gates at ship/its own deploy and the gate skips it.
#
# WHERE it runs: the repo's ISOLATED GATE WORKSPACE (Release::GateWorkspace) — a
# private detached worktree pinned at the origin/release SHA, under a dedicated
# gate lock, with a test DB the gate PROVES is private before it runs (it boots
# the app and reads back the resolved connection, and REFUSES a shared DB) — NOT
# the shared primary checkout, which stays on a clean `main`. A suite that lazily
# autoloads over minutes cannot be trusted against a tree a concurrent session can
# `git checkout` out from under it; that is what made the gate false-fail on green
# code. See docs/agents/modules/gates/g3-candidate.md.
#
# ANY COMMAND SHAPE IS SAFE HERE. The gate PREPARES the test env in its workspace
# (`bin/rails db:test:prepare test:prepare`, one boot) before running your command,
# so a PATH-ARG lane works. It must: Rails runs `test:prepare` — the hook that BUILDS
# gitignored assets like app/assets/builds/tailwind.css — only when NO argument looks
# like a path, and the workspace is a `--detach` worktree, which does NOT copy
# gitignored files. Before the gate prepared the env, the satellites' path-arg lanes
# rendered views with NO stylesheet and the gate went RED on GREEN code (2026-07-12).
# Do not "fix" that class of failure by reshaping a command here — the gate owns it.
#
# WHAT to register as qa_test_cmd — the question is NOT "hub or satellite", it is
# "does this repo's DEPLOY run the suite?":
#   * a repo whose OWN DEPLOY runs the full suite (turf-monster: bin/deploy) — the
#     integration SUBSET (`bin/rails test test/integration`): review owns the base
#     tier, and their ship test_cmd / own deploy owns the full pre-prod run
#     (registering the same full suite twice would re-run it every ship, since
#     their SHAs routinely drift via re-pins).
#   * a repo whose deploy runs NO test step (ROLIO via git_push_heroku, the HUB via
#     github_actions — its workflow only pushes + smokes) — the registered command
#     IS the last gate before prod and must be
#     CI's FULL suite, VERBATIM (`bin/rails db:test:prepare test test:system`), at
#     BOTH gates. The 90/10 policy certifies the whole release batch ONCE at G3, and
#     ship's test_gate self-gates when the frozen SHA matches that certified run, so
#     the suite still runs once per batch; a drifted/straggler SHA re-triggers it at
#     ship. Registering the SUBSET for one of these leaves prod ungated for every
#     tier the subset skips — exactly how rolio's system tier went uncovered.
#
# THESE GATES INCLUDE THE SYSTEM TIER, and the exact SHAPE is load-bearing.
# `bin/rails test` alone SKIPS test/system — so a system-test regression used to
# ride the release branch straight into QA ungated, which is the hole this closes.
# The gate must run what CI runs, so each registers ITS OWN ci.yml command verbatim
# (repos_test.rb parses both ci.yml files and asserts the match):
#
#   * DO NOT "simplify" it to `bin/rails test test:system`. That shape is BROKEN:
#     `test` is a real rails COMMAND, so `test:system` is parsed as a PATH and the
#     run dies with `LoadError: cannot load such file -- <root>/test:system`. It
#     works in ci.yml only because the FIRST arg (`db:test:prepare`) is NOT a rails
#     command, which routes the whole line through RAKE — where `test` and
#     `test:system` are two separate rake tasks. Keep db:test:prepare first.
#   * The leading `db:test:prepare` is therefore what selects the rake path. It is
#     also harmless to re-run: the gate already ran it in prepare_gate_workspace!,
#     against a test DB it PROVED private first, so the re-purge (~2s) hits only
#     the gate's own DB.
#   * Assets need NO setup step in the gate's virgin worktree — but the reason is
#     PER-APP, so do not carry one app's mechanism over to the other:
#       - the HUB self-heals: `rails test`/`rails test:system` each call
#         run_prepare_task -> rake `test:prepare`, which tailwindcss-rails enhances
#         with `tailwindcss:build`, so the gitignored app/assets/builds/tailwind.css
#         is BUILT on demand (a bare `db:test:prepare` does NOT build it — the gem
#         hooks test:prepare, not db:).
#       - ROLIO needs no build at all: it is sprockets + importmap and leaves
#         `config.assets.compile` at its default TRUE in test (it is set false only
#         in production.rb), so `stylesheet_link_tag "application"` COMPILES AT
#         REQUEST TIME from the tracked sources in app/assets/stylesheets/. There is
#         no tailwindcss-rails hook here to rely on, and none is needed.
#   * The BROWSER is driven headless by Selenium Manager, which fetches a chromedriver
#     matched to the installed Chrome (same reason ci.yml installs NO chromedriver).
#     This suite no longer runs at the gate — since DevOps v2 Phase 4 GitHub CI is the
#     G3/G4 verdict — so there is no local no-Chrome pre-check: CI's Actions runner
#     always has Chrome, and a browserless dev host never gates this command.
#
# NOT to be confused with the PLAYWRIGHT e2e tier, which still does NOT belong
# here: Rails system tests boot their OWN Puma in-process (Capybara), so they run
# fine in the gate workspace, whereas a Playwright run needs an already-booted
# SERVER. The e2e-smoke half of prepare's tier remains prepare's own built-in
# post-deploy `/up` boot wait against QA — the QA deploy IS that smoke.
#
# PARSING: both test_cmd and qa_test_cmd are Shellwords-parsed into an argv
# (bin/release's test_cmd_argv — no shell interpolation), so quoted/spaced args
# survive as single elements: `bin/rails test "test/integration/a b_test.rb"`.
# Plain flag-style commands split exactly as before. An unbalanced quote aborts
# the run naming the offending string instead of executing a garbled command.
#
# gem fields:
#   version_file — path (inside the gem repo) declaring the version to publish.
#                  Read for the producer-first publish + the board indicator.
#                    studio-engine → lib/studio/version.rb  (VERSION = "x.y.z")
#                    solana-studio → lib/solana_studio/version.rb (VERSION = "x.y.z")
#   gemspec      — the .gemspec `gem build` packages (defaults to <repo>.gemspec).
#   release_check — optional repo-relative pre-publish gate run with `--build`
#                   (syntax + unit + build) before the artifact is pushed.
#   build_cmd    — human-readable build command (documentation; bin/release
#                  drives release_check/gem build directly).
#   lint_lane    — optional. `none` DECLARES that this repo ships no rubocop, so
#                  the cert reader (FullSuiteGate.required_lanes) stops asking it
#                  for a `[rubocop@<fp>]` line and it owes only `[full-suite@<fp>]`.
#                  DECLARED, NEVER INFERRED: the gate does not probe for a rubocop
#                  binary, because a waiver inferred from a missing install turns
#                  every broken rubocop into a silently skipped lane. Omitted (the
#                  default) = the repo owes BOTH lanes, and every unrecognised slug
#                  or unreadable registry owes both too — this fails CLOSED.
#
# The gem repos are checked out as SIBLINGS of this app (the projects root):
#   /Users/alex/projects/<repo>. `bin/release` resolves them relative to the
#   app root's parent, so run ship from a PRIMARY checkout, not a worktree.

gems:
  studio-engine:
    ladder: three-rung
    version_file: lib/studio/version.rb
    gemspec: studio-engine.gemspec
    release_check: bin/release-check
    build_cmd: bin/release-check --build
    # lint_lane: none — THIS REPO SHIPS NO RUBOCOP, and the cert gate must be told
    # rather than left to guess. There is no rubocop in the Gemfile, none in the
    # gemspec, no .rubocop.yml, and `bundle exec rubocop` fails outright. Its
    # static gate is `ruby -c` over the tree, run inside bin/release-check, which
    # the `release_check` key above already names.
    #
    # DECLARED, NEVER INFERRED. bin/lib/full_suite_gate.rb reads this key; it does
    # NOT probe for a rubocop binary. Inferring the waiver from a missing binary
    # would turn every broken rubocop install into a silently skipped lane — the
    # self-declaration disease config/e2e_lane.yml exists to prevent. A repo opting
    # out of a lint lane must be a visible, reviewable diff line, which is what
    # this is.
    #
    # WHY IT WAS NEEDED (2026-08-24): dor-check demands a full-suite AND a rubocop
    # cert per NAMED repo. A task naming studio-engine could therefore never be
    # certified, and the only way through was pointing FULL_SUITE_RUBOCOP_CMD at a
    # no-op — recording a rubocop pass for a lint that never ran. That was refused;
    # this is the honest fix. If the engine ever GAINS rubocop, delete this line.
    lint_lane: none
  solana-studio:
    ladder: three-rung
    # Was `solana-studio.gemspec` until 2026-08-20. bin/dor-check refuses a PR
    # that edits the registered version_file, matching on PATH — so pointing it
    # at the gemspec made the WHOLE gemspec release-owned: spec.files, the
    # runtime dependencies and the metadata, none of which the conductor writes
    # and none of which had another writer. The manifest was un-editable through
    # the normal cycle, which surfaced the first time the gem needed to ship a
    # new directory (its Rails engine's app/). Split to a dedicated version file,
    # the shape studio-engine already uses, so each file has its real owner:
    # this one the release, the gemspec the PR.
    version_file: lib/solana_studio/version.rb
    gemspec: solana-studio.gemspec
    # The gem grew a suite runner with its engine. Registering it here gives the
    # publish a pre-artifact gate instead of pushing on membership alone.
    release_check: bin/release-check
    build_cmd: bin/release-check --build
    # lint_lane: none — SAME FACT AS studio-engine ABOVE, and verified against
    # origin/accepted on 2026-08-31 rather than assumed: `git ls-tree -r` matches
    # nothing named rubocop (no .rubocop.yml, no bin/rubocop — bin/ holds only
    # release-check, e2e-executed-set-check and lib/), and rubocop appears nowhere
    # in the Gemfile, the gemspec or Gemfile.lock. Its static gate is bin/release-check,
    # which the `release_check` key above already names, and which is exactly what CI
    # runs here.
    #
    # WHY IT WAS NEEDED (found 2026-08-31 by carl, reviewing solana-studio #9):
    # bin/full-suite-check ran `bin/rubocop` anyway, got COULD NOT RUN, and then
    # DISCARDED THE GREEN SUITE LANE WITH IT ("no evidence recorded for the red
    # lane(s)" — the writer exits before recording when any lane is red). So the
    # full cert could never go green in this repo. That is not a cosmetic gap:
    # docs/agents/agents/carl/sops/pr-review-primary.md names bin/full-suite-check
    # as THE escape when a PR's CI verdict is red, pending or unreadable, so a
    # reviewer following the SOP here had no path and would stall or merge on
    # weaker evidence than the SOP intends.
    #
    # DECLARED, NEVER INFERRED — and now also AUDITED. bin/lib/full_suite_gate.rb
    # reads this key and never probes for a binary (a waiver inferred from a missing
    # install turns every BROKEN rubocop into a silently skipped lane). The other
    # half is bin/lib/lint_waiver_guard.rb: if this repo ever GAINS a lint toolchain,
    # the cert REFUSES rather than honouring a claim that has stopped being true, and
    # tells you to delete this line. So you do not have to remember to — but delete
    # it when that day comes.
    lint_lane: none

apps:
  mcritchie-studio:
    ladder: three-rung
    # Hub: github_actions deploys via a workflow that runs NO test step (just the
    # Heroku push + /up smoke), so gate prod on the suite here — same as the old
    # git_push_heroku mechanic did.
    # (Ship's gate SELF-GATES when the frozen SHA is exactly what the G3 pre-QA
    # gate below already certified this run — full suite runs once per batch.
    # test_cmd and qa_test_cmd must stay the SAME STRING or that skip misses and
    # the suite runs twice: ship_gate_skip? compares the commands verbatim.)
    test_cmd: bin/rails db:test:prepare test test:system
    # Pre-QA gate (G3): the hub certifies CI's FULL suite — the base tier AND the
    # SYSTEM tier — on the release batch. This string is ci.yml's `test` job
    # command VERBATIM, and repos_test.rb parses ci.yml and asserts they match,
    # so the gate cannot silently drift out from under CI again.
    qa_test_cmd: bin/rails db:test:prepare test test:system
    # DevOps v2 Phase 2: the hub deploys through GitHub Actions (prod-deploy.yml),
    # NOT a local git push. The workflow does the Heroku push + hard /up smoke;
    # smoke_url stays for the board/deploy record. QA goes through qa-deploy.yml
    # (dispatched by `bin/release prepare` for this adapter). rolio + turf are
    # unchanged.
    prod_deploy:
      strategy: github_actions
      workflow: prod-deploy.yml
      smoke_url: https://mcritchie.studio
  turf-monster:
    ladder: three-rung
    # Self-gates at SHIP (bin/deploy runs the full suite pre-prod) — but nothing
    # gated the QA deploy, so the prepare-owned integration tier runs here.
    qa_test_cmd: bin/rails test test/integration
    prod_deploy:
      strategy: repo_script
      command: bin/deploy
      args: ["--yes"]
  turf-vault:
    # THE ANCHOR PROGRAM. Registered 2026-08-31 after
    # Release::Conductor#validate_member_repos_known! aborted a live sweep
    # (rel-20260831-6f1ed1) with "can't deploy unknown repo(s):
    # mainnet-launch-doc-vault-rename (turf-vault), turf-vault-needs-ci
    # (turf-vault)". THE GUARD WAS RIGHT — it refuses to build a release naming a
    # repo the conductor has no plan for. The defect was this missing entry.
    #
    # WHY IT ONLY BIT THEN: turf-vault had never had a task reach `reviewed`.
    # /tasks/turf-vault-needs-ci gave the repo its first CI, which unblocked
    # /tasks/mainnet-launch-doc-vault-rename after FOUR held sweeps — and the
    # moment two turf-vault tasks became eligible members, the absence became a
    # hard abort.
    #
    # FILED UNDER `apps`, NOT `gems`, and the distinction is load-bearing: a
    # `gems` row makes the conductor PUBLISH the repo to RubyGems producer-first.
    # turf-vault has no gemspec and no business on RubyGems. `apps` + no
    # prod_deploy is the chain-ops shape — a first-class case, not a gap.
    #
    # LADDER: three-rung, VERIFIED not assumed. `git ls-remote` returns all three
    # refs (accepted b1648706, release f7be9680, main 0479fc8f, 2026-08-31), and
    # the local checkout carries origin/accepted + origin/release, which is what
    # repos_test's "every three-rung repo really has both rungs" actually reads.
    # The sweep had ALREADY promoted this repo successfully (PR #8, accepted →
    # release, 6 commits) before it aborted at the record step, so the promote
    # mechanic is proven on it rather than hoped for. Anything but three-rung
    # would be a false declaration AND would strand future turf-vault work on
    # `accepted` forever: Release::Ladder.sweepable is three-rung only.
    ladder: three-rung
    #
    # ⛔ NO prod_deploy — DELIBERATE, AND A SAFETY BOUNDARY, NOT AN OMISSION.
    #
    # turf-vault is an Anchor program custodying real USDC in live contest
    # vaults. It is not a deployable app and there is no automated path that has
    # EVER deployed it: nothing in bin/ or app/ contains `anchor deploy` or
    # `program deploy`. The program is upgraded by hand through
    # scripts/squad-upgrade.js against a Squads 2-of-3 multisig, gated by
    # docs/MAINNET_LAUNCH.md and docs/VERIFICATION_MATRIX.md — a human, multi-
    # signer act that a release conductor must never attempt on its own.
    #
    # Declaring ANY adapter here would make `bin/release ship` try to execute
    # that act. With no adapter, ship advances main and records `no production
    # deploy target — nothing dispatched`, which is the truth. Do NOT "fix" the
    # absence with a no-op deploy script — that makes ship REPORT a deploy that
    # never happened, the exact foot-gun chain-ops' entry documents below.
    #
    # ⛔ NO test_cmd, NO qa_test_cmd — ALSO DELIBERATE.
    #
    # Both gate commands run inside a Rails GATE WORKSPACE, and
    # Release::GateWorkspace#prepare_gate_workspace! runs `bin/rails
    # db:test:prepare test:prepare` there BEFORE the registered command. This
    # repo is Rust/Anchor and has no bin/rails, so registering EITHER key arms a
    # Rails gate against a repo that cannot run one — it would fail on ENOENT at
    # G3 (aborting an unrelated batch sweep) or at G4 (after push_frozen_main has
    # already advanced origin/main, the way chain-ops' phantom bin/deploy wedged
    # a ship on 2026-08-22). UNSET is the correct declaration: the pre-QA gate
    # and the ship gate both skip a repo that registers no command.
    #
    # There is also no single command to register. CI here is three lanes across
    # two toolchains (`cargo check --workspace --all-targets --locked`, `cargo
    # clippy … -D clippy::correctness`, and `npm run check:doc-op-refs`), not one
    # suite invocation.
    #
    # NO qa_deploy / QA ENV, and none is needed. Release::Repos.qa_app defaults
    # the key to the repo slug, turf-vault is absent from
    # config/qa_environments.yml, and `bin/release prepare` warns + skips the QA
    # deploy for an app with no registered QA environment (bin/release.rb:3164) —
    # the same path tax-studio and chain-ops take. An Anchor program has no dyno
    # to boot and no /up to smoke.
    #
    # ⛔ AND THEREFORE — DECLARED QA-EVIDENCE EXEMPT. Read this before deleting it.
    #
    # The two skips above are REAL, and until 2026-09-06 they were also SILENT:
    # the pre-QA gate wrote no metadata["qa_gates"] entry for this repo and the QA
    # deploy loop `next`s before `qa_shas[repo] = sha`, so a candidate carrying
    # turf-vault recorded ZERO QA evidence for it. Release#unproven_members then
    # held every member naming turf-vault at `reviewed` forever —
    # rel-20260905-d6c266 held sharpen-update-signers-recipe and
    # document-signer-rotation-path; rel-20260906-90c443 held
    # qualify-vault-authority-by-cluster. Re-running the sweep never cleared it,
    # because the cause was structural: no run can produce evidence for a step
    # that is skipped by design.
    #
    # THE FIX IS THIS KEY, NOT A LOOSER GUARD. The tempting repair — teach the
    # guard to ignore any repo with no QA config — would disarm it for EVERY repo,
    # including a Rails app whose QA env someone simply forgot to register. That
    # is a far worse defect than the one it closes: the guard exists because on
    # 2026-08-13 a member was stamped `assembled` for a repo the candidate never
    # touched. So the exemption is DECLARED here, per repo, and the guard reads
    # the declaration. Absent this key a repo is `required` — fail-closed, held.
    #
    # WHY EXEMPT RATHER THAN "OWES OTHER EVIDENCE": QA evidence answers one
    # question — did this candidate's code get DEPLOYED somewhere a human can
    # review it before production? For an Anchor program the honest answer is that
    # the question does not apply: there is no dyno, no URL, and no deploy of any
    # kind (the program is upgraded by hand through a Squads 2-of-3 multisig).
    # This repo's `cargo check` / `clippy` / doc-op lanes DO run — on every push
    # to accepted, release and main — but they are CI, and the sweep already reads
